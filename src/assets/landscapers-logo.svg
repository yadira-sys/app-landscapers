<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Dark background -->
  <rect width="120" height="120" fill="#3a3a3a"/>

  <!-- Icon: geometric horizontal bars (like the logo) -->
  <!-- Top group: 3 bars left-aligned, varying width -->
  <rect x="22" y="22" width="38" height="7" fill="white"/>
  <rect x="22" y="33" width="28" height="7" fill="white"/>
  <rect x="22" y="44" width="18" height="7" fill="white"/>

  <!-- Bottom group: 3 bars right-aligned -->
  <rect x="60" y="55" width="38" height="7" fill="white"/>
  <rect x="70" y="66" width="28" height="7" fill="white"/>
  <rect x="80" y="77" width="18" height="7" fill="white"/>

  <!-- Text: LANDSCAPERS -->
  <text
    x="60"
    y="108"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9"
    font-weight="700"
    letter-spacing="2"
    fill="white"
    text-anchor="middle"
  >LANDSCAPERS</text>
</svg>
